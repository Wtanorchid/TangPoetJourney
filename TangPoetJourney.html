<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>苏轼 · Journey</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         寒食帖背景
    ========================== -->

    <div class="scroll-bg">

        <div class="scroll-track">

            <img src="hanshi.png" alt="寒食帖">

            <img src="hanshi.png" alt="寒食帖">

        </div>

    </div>


    <!-- =========================
         第一页：首页
    ========================== -->

    <section class="hero">

        <div class="hero-content">

            <p class="subtitle">
                SU SHI · JOURNEY
            </p>

            <h1>
                苏轼
            </h1>

            <p class="name">
                1037 — 1101
            </p>

            <p class="description">
                一生辗转于山河之间，<br>
                也把自己的生命写进了诗词。
            </p>

            <button id="startButton">
                开始探索
            </button>

        </div>

    </section>


    <!-- =========================
         第二页：苏轼一生
    ========================== -->

    <section class="timeline" id="timeline">

        <p class="section-subtitle">
            THE JOURNEY
        </p>

        <h2>
            一生
        </h2>

        <p class="section-description">
            从眉山到汴京，从黄州到儋州。<br>
            苏轼的一生，也是一场不断远行的旅程。
        </p>


        <div class="timeline-list">

            <div class="timeline-item">

                <span class="year">
                    1037
                </span>

                <div>
                    <h3>
                        出生 · 眉山
                    </h3>

                    <p>
                        苏轼出生于四川眉山。
                    </p>
                </div>

            </div>


            <div class="timeline-item">

                <span class="year">
                    1057
                </span>

                <div>
                    <h3>
                        进士及第 · 汴京
                    </h3>

                    <p>
                        二十岁出蜀赴京，参加科举并高中进士。
                    </p>
                </div>

            </div>


            <div class="timeline-item">

                <span class="year">
                    1079
                </span>

                <div>
                    <h3>
                        乌台诗案 · 黄州
                    </h3>

                    <p>
                        因“乌台诗案”入狱，后被贬黄州。
                    </p>
                </div>

            </div>


            <div class="timeline-item">

                <span class="year">
                    1082
                </span>

                <div>
                    <h3>
                        赤壁 · 黄州
                    </h3>

                    <p>
                        写下《赤壁赋》《念奴娇·赤壁怀古》等名篇。
                    </p>
                </div>

            </div>


            <div class="timeline-item">

                <span class="year">
                    1101
                </span>

                <div>
                    <h3>
                        逝世 · 常州
                    </h3>

                    <p>
                        苏轼卒于常州，享年六十四岁。
                    </p>
                </div>

            </div>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
